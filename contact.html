<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصل بنا — عُدّة</title>
<meta name="description" content="تواصل مع فريق موقع عُدّة لأي استفسار أو اقتراح.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0; --bg-elev:#FFFFFF; --bg-elev-2:#F1EDE4; --border:#E3DDCF;
    --brass:#B8863B; --brass-light:#8B6428; --bone:#2B2A28; --bone-dim:#6B6559;
    --radius:10px; --font-display:'IBM Plex Sans Arabic',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, rgba(184,134,59,0.12) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--bone);font-family:var(--font-display);line-height:1.8;min-height:100vh;
  }
  a{color:var(--brass-light);}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px;}
  header.top{padding:36px 0 18px;text-align:center;}
  .logo{
    display:inline-flex;align-items:center;gap:10px;
    font-size:1.7rem;font-weight:700;color:var(--bone);text-decoration:none;
  }
  .logo .mark{
    width:32px;height:32px;border:2px solid var(--brass);border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--brass-light);font-size:.95rem;font-weight:600;transform:rotate(-6deg);
  }
  main{padding:20px 0 60px;}
  .card{
    background:var(--bg-elev);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px 26px;
    box-shadow:0 1px 3px rgba(43,42,40,0.05);
  }
  h1{font-size:1.4rem;margin:0 0 8px;}
  p.hint{color:var(--bone-dim);font-size:.9rem;margin:0 0 22px;}
  .contact-box{
    display:flex;align-items:center;gap:14px;
    background:var(--bg-elev-2);border:1px solid var(--border);
    border-radius:8px;padding:16px 18px;margin-bottom:14px;
  }
  .contact-box .ic{
    width:38px;height:38px;border-radius:50%;background:var(--brass);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;flex:0 0 auto;
  }
  .contact-box a{font-family:var(--font-mono);font-weight:600;text-decoration:none;}
  .contact-box a:hover{text-decoration:underline;}
  footer{border-top:1px solid var(--border);padding:26px 0;text-align:center;color:var(--bone-dim);font-size:.8rem;}
  footer a{margin:0 8px;}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html"><span class="mark">ع</span> عُدّة</a>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h1>اتصل بنا</h1>
    <p class="hint">لأي استفسار، اقتراح أداة جديدة، أو ملاحظة على أداة موجودة، تواصل معنا عبر البريد التالي:</p>

    <div class="contact-box">
      <div class="ic">✉</div>
      <a href="mailto:alerfaniahmed@gmail.com">alerfaniahmed@gmail.com</a>
    </div>

    <p class="hint">سنحرص على الرد في أقرب وقت ممكن.</p>
  </div>
</main>

<footer>
  <a href="index.html">الرئيسية</a>
  <a href="privacy.html">سياسة الخصوصية</a>
  <a href="about.html">من نحن</a>
</footer>

</body>
</html>
