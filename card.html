<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زاهد الاسلام — بطاقة تعريف</title>
<meta name="description" content="بطاقة التعريف الرقمية لـ زاهد الاسلام — مدير مكتبة النسيم المركزية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0; --bg-elev:#FFFFFF; --bg-elev-2:#F1EDE4; --border:#E3DDCF;
    --brass:#B8863B; --brass-light:#8B6428; --bone:#2B2A28; --bone-dim:#6B6559;
    --patina:#3F5A34;
    --radius:14px; --font-display:'IBM Plex Sans Arabic',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, rgba(184,134,59,0.12) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--bone);font-family:var(--font-display);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    width:100%;max-width:380px;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:var(--radius);padding:34px 28px;text-align:center;
    box-shadow:0 4px 18px rgba(43,42,40,0.08);
  }
  .avatar{
    width:88px;height:88px;border-radius:50%;background:var(--bg-elev-2);border:3px solid var(--brass);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
    font-size:2rem;font-weight:700;color:var(--brass-light);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  h1{font-size:1.3rem;margin:0 0 6px;color:var(--bone);}
  p.title{color:var(--bone-dim);font-size:.95rem;margin:0 0 26px;}
  .actions{display:flex;flex-direction:column;gap:12px;}
  .action-btn{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-elev-2);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;text-decoration:none;color:var(--bone);font-weight:600;font-size:.95rem;
    transition:.15s;
  }
  .action-btn:hover{border-color:var(--brass);}
  .action-btn .ic{
    width:36px;height:36px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;
  }
  .action-btn.call .ic{background:var(--brass);}
  .action-btn.whatsapp .ic{background:var(--patina);}
  .action-btn.imo .ic{background:#fff;border:1px solid var(--border);padding:4px;}
  .action-btn.imo .ic img{width:100%;height:100%;object-fit:contain;}
  .action-btn .num{font-family:var(--font-mono);direction:ltr;margin-inline-start:auto;color:var(--bone-dim);font-size:.85rem;font-weight:500;}
  footer{margin-top:26px;font-size:.72rem;color:#B7AF9F;}
  footer a{color:var(--brass-light);text-decoration:none;}
</style>
</head>
<body>

<div class="card">
  <div class="avatar"><img src="avatar.jpg" alt="زاهد الاسلام"></div>
  <h1>زاهد الاسلام</h1>
  <p class="title">مدير مكتبة النسيم المركزية</p>

  <div class="actions">
    <a class="action-btn call" href="tel:+966533382179">
      <div class="ic">📞</div>
      <span>اتصال مباشر</span>
      <span class="num">0533382179</span>
    </a>
    <a class="action-btn whatsapp" href="https://wa.me/966533382179" target="_blank" rel="noopener">
      <div class="ic">💬</div>
      <span>واتساب</span>
      <span class="num">0533382179</span>
    </a>
    <button type="button" class="action-btn imo" id="imoBtn" style="cursor:pointer;">
      <div class="ic"><img src="imo-icon.png" alt="imo"></div>
      <span>imo (نسخ الرقم)</span>
      <span class="num">0509769496</span>
    </button>
  </div>

  <footer>بطاقة تعريف رقمية — <a href="index.html">عُدّة</a></footer>
</div>

<script>
document.getElementById('imoBtn').addEventListener('click', ()=>{
  navigator.clipboard.writeText('0509769496').then(()=>{
    const btn = document.getElementById('imoBtn');
    const span = btn.querySelector('span');
    const original = span.textContent;
    span.textContent = 'تم نسخ الرقم ✓';
    setTimeout(()=>{ span.textContent = original; }, 1800);
  });
});
</script>

</body>
</html>
